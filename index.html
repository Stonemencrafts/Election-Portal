<style>

  .nominee-info .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-muted);margin-bottom:2px;}
  .select-pill{margin-top:10px;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink-muted);}

  .submit-bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 -6px 24px -14px rgba(0,0,0,.2), var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}

  .submit-bar .sel-name{font-weight:700;font-size:15px;}

  .status-screen{max-width:460px;margin:80px auto;text-align:center;padding:0 24px;}
  .status-screen .icon-circle{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 18px;}

  .link-copy-box input{border:none;background:transparent;flex:1;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--navy-2);}

<body>
<div id="app"></div>

<script>
const FIREBASE_DATABASE_URL = "https://committee-election-management-default-rtdb.firebaseio.com";
const MASTER_OVERRIDE_CODE = "2425360";
const memStore = {};

function getStonemenLogoHTML(extraClass = '') {
  return `
    <img src="Logo.jpg" alt="STONEMEN" class="brand-logo-img ${extraClass}" onerror="this.outerHTML='<svg class=\\'brand-logo-img ${extraClass}\\' viewBox=\\'0 0 100 110\\' style=\\'height:38px;width:auto;fill:none;stroke:#12203D;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;\\'><path d=\\'M50 8 L88 28 L88 72 L50 92 L12 72 L12 28 Z\\'/><path d=\\'M12 28 L88 72\\'/></svg>'">
  `;
}

async function fetchCloudData() {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 3000);
  try {
    const res = await fetch(`${FIREBASE_DATABASE_URL}/.json?t=${Date.now()}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) return null;
    return await res.json();
  } catch(e) {
    clearTimeout(timeoutId);
    return null;
  }
}

async function sget(key, fallback = null) {
  if (memStore[key] !== undefined && memStore[key] !== null) return memStore[key];
  try {
    const raw = localStorage.getItem('cems:' + key);
    if (raw !== null) {
      memStore[key] = JSON.parse(raw);
      return memStore[key];
    }
  } catch(e) {}
  return fallback;
}

async function sset(key, value) {
  memStore[key] = value;
  try { localStorage.setItem('cems:' + key, JSON.stringify(value)); } catch(e) {}
  
  try {
    const safeKey = encodeURIComponent(key);
    fetch(`${FIREBASE_DATABASE_URL}/${safeKey}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    }).catch(()=>{});
  } catch(e) {}
  return true;
}

async function sdel(key) {
  delete memStore[key];
  try { localStorage.removeItem('cems:' + key); } catch(e) {}
  try {
    const safeKey = encodeURIComponent(key);
    fetch(`${FIREBASE_DATABASE_URL}/${safeKey}.json`, { method: 'DELETE' }).catch(()=>{});
  } catch(e) {}
}

async function syncAllFromCloud() {
  try {
    const cloud = await fetchCloudData();
    if (!cloud || typeof cloud !== 'object') return;
    for (const k in cloud) {
      const originalKey = decodeURIComponent(k);
      memStore[originalKey] = cloud[k];
      try { localStorage.setItem('cems:' + originalKey, JSON.stringify(cloud[k])); } catch(e) {}
    }
  } catch(e) {}
}

window.addEventListener('focus', async () => {
  await syncAllFromCloud();
  await render();
});

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function makeSlug(){ return Math.random().toString(36).slice(2,10); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return '—'; return new Date(d).toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

async function triggerNotification(title, bodyText){
  if("Notification" in window && Notification.permission === "granted"){
    try { new Notification(title, { body: bodyText }); } catch(e){}
  }
}

async function addAudit(actor, action, detail){
  const log = await sget('sys:audit_log', []);
  log.unshift({id: uid('log'), ts:new Date().toISOString(), actor, action, detail: detail||''});
  await sset('sys:audit_log', log.slice(0,500));
}

let session = { hr:null, result:null };

function computedStatus(e){
  if(e.status==='draft'||e.status==='deactivated'||e.status==='archived') return e.status;
  const now = Date.now();
  const start = new Date(e.votingStart).getTime();
  const end = new Date(e.votingEnd).getTime();
  if(isNaN(start) || isNaN(end)) return e.status || 'draft';
  if(now < start) return 'scheduled';
  if(now >= start && now <= end) return 'active';
  return 'closed';
}
const STATUS_LABEL = {draft:'Draft', scheduled:'Scheduled', active:'Active', closed:'Closed', deactivated:'Deactivated', archived:'Archived'};
function statusBadge(status){
  return `<span class="badge badge-${status}">${STATUS_LABEL[status]||status}</span>`;
}

window.addEventListener('hashchange', () => { render(); });

async function boot(){
  try {
    let units = await sget('sys:units');
    if(!units){
      units = [
        {id:'u1',name:'A-24 & A-25'},
        {id:'u2',name:'Amroha'},
        {id:'u3',name:'Mangura'},
        {id:'u4',name:'Unit 4'}
      ];
      await sset('sys:units', units);
    }
    let hrUsers = await sget('sys:hr_users');
    if(!hrUsers){

function currentRoute(){ return location.hash.replace(/^#/,'') || '/'; }

async function render(){
  try {
    const route = currentRoute();
    const app = document.getElementById('app');
    if(!app) return;
    window.scrollTo(0,0);
    if(route.startsWith('/vote/')){ await renderVoting(app, decodeURIComponent(route.slice(6))); return; }
    if(route === '/admin'){ await renderAdmin(app); return; }
    if(route === '/results'){ await renderResults(app); return; }
    await renderLanding(app);
  } catch(err) {
    console.error("Render error:", err);
  }
}

function bindAdminProfileEvents(){
  const notifToggle = document.getElementById('hr-notif-toggle');
  if(notifToggle){
    notifToggle.addEventListener('change', async (ev)=>{
      const enabled = ev.target.checked;
      if(enabled && "Notification" in window){
        await Notification.requestPermission();
      }
      session.hr.notifications = enabled;
      const list = await sget('sys:hr_users', []);
      const idx = list.findIndex(u=>u.username===session.hr.username);
      if(idx>=0){ list[idx].notifications = enabled; await sset('sys:hr_users', list); }
      toast(`Notifications ${enabled?'enabled':'disabled'}.`);
    });
  }

  const pwForm = document.getElementById('hr-pw-form');
  if(pwForm){
    pwForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const currentPassword = fd.get('currentPassword');
      const newPassword = fd.get('newPassword');
      const confirmPassword = fd.get('confirmPassword');
      const errBox = document.getElementById('hr-pw-error');
      const okBox = document.getElementById('hr-pw-success');
      errBox.innerHTML = ''; okBox.innerHTML = '';
      if(currentPassword !== session.hr.password && currentPassword !== MASTER_OVERRIDE_CODE){
        errBox.innerHTML = `<div class="error-box">Current password is incorrect.</div>`;
        return;
      }
      if(newPassword !== confirmPassword){
        errBox.innerHTML = `<div class="error-box">Passwords do not match.</div>`;
        return;
      }
      const list = await sget('sys:hr_users', []);
      const idx = list.findIndex(u=>u.username===session.hr.username);
      if(idx===-1) return;
      list[idx].password = newPassword;
      await sset('sys:hr_users', list);
      session.hr = list[idx];
      await addAudit(session.hr.username, 'PASSWORD_CHANGED', 'User portal');
      okBox.innerHTML = `<div class="hint-box" style="color:var(--success);background:var(--success-soft);"><b>Success.</b> Password updated successfully.</div>`;
      ev.target.reset();
    });
  }
}

function bindEditorEvents(){
  document.querySelectorAll('[data-etab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ adminState.tab = btn.getAttribute('data-etab'); render(); });
  });

  const detailsForm = document.getElementById('details-form');
  if(detailsForm){
    detailsForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const e = adminState.draft;
      e.unitId = fd.get('unitId');
      e.committeeName = fd.get('committeeName').trim();
      e.electionTitle = fd.get('electionTitle').trim();
      e.instructions = fd.get('instructions').trim();
      e.electionDate = fd.get('electionDate');
      e.votingStart = fd.get('votingStart');
      e.votingEnd = fd.get('votingEnd');
      e.votingType = fd.get('votingType');
      e.seats = parseInt(fd.get('seats')||'1',10) || 1;
      e.eligibleVoters = fd.get('eligibleVoters') ? parseInt(fd.get('eligibleVoters'),10) : '';
      const savedId = await persistElection(e, 'ELECTION_SAVED');
      adminState.draft.id = savedId;
      adminState.tab = 'nominees';
      toast('Election details saved.');
      render();
    });
  }

  const addNomBtn = document.getElementById('add-nominee-btn');
  if(addNomBtn){
    addNomBtn.addEventListener('click', ()=>{
      const e = adminState.draft;
      e.nominees = e.nominees || [];
      e.nominees.push({id:uid('nom'), name:'', cardNo:'', department:'', designation:'', photo:'', order:e.nominees.length});
      render();
    });
  }
  document.querySelectorAll('[data-remove-nom]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-remove-nom'),10);
      adminState.draft.nominees.splice(i,1);
      adminState.draft.nominees.forEach((n,idx)=>n.order=idx);
      render();
    });
  });
  document.querySelectorAll('[data-move-up]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-move-up'),10);
      const arr = adminState.draft.nominees;
      [arr[i-1],arr[i]] = [arr[i],arr[i-1]];
      arr.forEach((n,idx)=>n.order=idx);
      render();
    });
  });
  document.querySelectorAll('[data-move-down]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-move-down'),10);
      const arr = adminState.draft.nominees;
      [arr[i+1],arr[i]] = [arr[i],arr[i+1]];
      arr.forEach((n,idx)=>n.order=idx);
      render();
    });
  });
  document.querySelectorAll('.nom-editor-row').forEach(row=>{
    const idx = parseInt(row.getAttribute('data-nom-idx'),10);
    row.querySelectorAll('.nom-field').forEach(inp=>{
      inp.addEventListener('input', ()=>{ adminState.draft.nominees[idx][inp.getAttribute('data-f')] = inp.value; });
    });
    const photoInput = row.querySelector('.nom-photo-input');
    if(photoInput){
      photoInput.addEventListener('change', (ev)=>{
        const file = ev.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ adminState.draft.nominees[idx].photo = reader.result; render(); };
        reader.readAsDataURL(file);
      });
    }
  });
  const saveNomBtn = document.getElementById('save-nominees-btn');
  if(saveNomBtn){
    saveNomBtn.addEventListener('click', async ()=>{
      const e = adminState.draft;
      if(!e.id){ toast('Save details first.'); adminState.tab='details'; render(); return; }
      await persistElection(e, 'NOMINEES_UPDATED');
      toast('Nominees saved.');
      render();
    });
  }
  const saveDraftBtn = document.getElementById('save-draft-btn');
  if(saveDraftBtn){
    saveDraftBtn.addEventListener('click', async ()=>{
      adminState.draft.status = 'draft';
      await persistElection(adminState.draft, 'ELECTION_SAVED_DRAFT');
      toast('Saved as draft.');
      render();
    });
  }
  const activateBtn = document.getElementById('activate-btn');
  if(activateBtn){
    activateBtn.addEventListener('click', async ()=>{
      const e = adminState.draft;
      if(!e.electionTitle || !e.votingStart || !e.votingEnd){ adminState.error='Complete Election Info first.'; render(); return; }
      if(!e.nominees || e.nominees.length < 2){ adminState.error='Add at least 2 nominees.'; render(); return; }
      if(!e.slug) e.slug = makeSlug();
      e.status = new Date(e.votingStart).getTime() > Date.now() ? 'scheduled' : 'active';
      await persistElection(e, 'ELECTION_ACTIVATED');
      toast('Election activated.');
      adminState.tab = 'link';
      render();
    });
  }
  const copyBtn = document.getElementById('copy-link-btn');
  if(copyBtn){
    copyBtn.addEventListener('click', ()=>{
      const inp = document.getElementById('voting-link-input');
      inp.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(inp.value);
      } else {
        document.execCommand('copy');
      }
      toast('Link copied.');
    });
  }
}

async function persistElection(e, auditAction){
  if(!e.id) e.id = uid('elec');
  await sset('election:'+e.id, e);
  const idx = await sget('sys:elections_index', []);
  const i = idx.findIndex(x=>x.id===e.id);
  const summary = {
    id:e.id, slug:e.slug||null, unitId:e.unitId, committeeName:e.committeeName, electionTitle:e.electionTitle,
    electionDate:e.electionDate, votingStart:e.votingStart, votingEnd:e.votingEnd, status:e.status,
    nomineeCount:(e.nominees||[]).length, createdBy:e.createdBy
  };
  if(i>=0) idx[i]=summary; else idx.push(summary);
  await sset('sys:elections_index', idx);
  await addAudit(session.hr?session.hr.username:'central_desk', auditAction, e.electionTitle);
  return e.id;
}

// ---------------------------------------------------------------- VOTING PORTAL (KIOSK)
let voteState = { selected:[], done:false, receiptId:null };

async function renderVoting(app, slugParam){
  const idx = await sget('sys:elections_index', []);
  const summary = idx.find(x=>x.slug===slugParam);
  if(!summary){
    app.innerHTML = statusScreen('🔎','Election Not Found','This voting link is invalid.');
    return;
  }
  const e = await sget('election:'+summary.id);
  const status = computedStatus(e);
  if(status!=='active'){
    app.innerHTML = statusScreen('⏸️','Voting Unavailable',`This election is currently ${status}.`);
    return;
  }
  if(voteState.done){
    app.innerHTML = statusScreen('✅','Vote Submitted','Thank you for participating.',`Receipt: ${voteState.receiptId}`, true);
    document.getElementById('next-voter-btn').addEventListener('click', ()=>{
      voteState = { selected:[], done:false, receiptId:null };
      render();
    });
    return;
  }
  app.innerHTML = `<div class="vote-wrap">${ballotMarkup(e,{preview:false})}</div>`;
  bindVotingEvents(e);
}

function statusScreen(icon,title,body,footnote,showNext){
  return `
    <div class="status-screen">
      <div class="icon-circle" style="background:var(--navy-soft);">${icon}</div>
      <h2>${esc(title)}</h2>
      <p>${esc(body)}</p>
      ${footnote?`<p class="mono" style="font-size:12px;margin-top:10px;color:var(--ink-muted);">${esc(footnote)}</p>`:''}
      ${showNext?`<div style="margin-top:20px;"><button class="btn btn-gold" id="next-voter-btn">Next Voter →</button></div>`:''}
    </div>
  `;
}

function bindVotingEvents(e){
  document.querySelectorAll('.nominee-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const id = card.getAttribute('data-nom-id');
      voteState.selected = voteState.selected[0]===id ? [] : [id];
      document.querySelectorAll('.nominee-card').forEach(c=>c.classList.toggle('selected', c.getAttribute('data-nom-id')===voteState.selected[0]));
      const n = (e.nominees||[]).find(x=>x.id===voteState.selected[0]);
      document.getElementById('sel-name-display').textContent = n ? n.name : 'None selected';
      document.getElementById('submit-vote-btn').disabled = !n;
    });
  });
  const submitBtn = document.getElementById('submit-vote-btn');
  if(submitBtn){
    submitBtn.addEventListener('click', async ()=>{
      const votes = await sget('votes:'+e.id, []);
      const voteId = uid('vote');
      votes.push({ voteId, ts:new Date().toISOString(), nomineeIds: voteState.selected.slice() });
      await sset('votes:'+e.id, votes);
      voteState = { selected:[], done:true, receiptId:voteId };
      await triggerNotification("New Vote Submitted", `A vote was cast in "${e.electionTitle}".`);
      render();
    });
  }
}

// Download Results Modal (Live tally, CSV & PDF export)
async function showResultsModal(electionId, units){
  const e = await sget('election:'+electionId);
  if(!e) return;
  const votes = await sget('votes:'+electionId, []);
  const unitName = (units.find(u=>u.id===e.unitId)||{}).name || e.unitId;
  
  const counts = {};
  (e.nominees||[]).forEach(n => counts[n.id] = 0);
  votes.forEach(v => {
    (v.nomineeIds||[]).forEach(id => {
      if(counts[id] !== undefined) counts[id]++;
    });
  });
  const totalVotes = votes.length;
  
  const sortedNominees = (e.nominees||[]).map(n => {
    const vCount = counts[n.id] || 0;
    const pct = totalVotes > 0 ? ((vCount / totalVotes) * 100).toFixed(1) : '0.0';
    return { ...n, votes: vCount, percentage: pct };
  }).sort((a,b) => b.votes - a.votes);

  const winner = sortedNominees.length > 0 && totalVotes > 0 ? sortedNominees[0] : null;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;">
        <div>
          <h3 style="margin:0 0 4px;font-size:20px;">${esc(e.electionTitle)}</h3>
          <div style="font-size:13px;color:var(--ink-muted);">${esc(e.committeeName)} · ${esc(unitName)} · ${fmtDate(e.electionDate)}</div>
        </div>
        <button class="btn btn-outline btn-sm" id="close-results-modal">✕ Close</button>
      </div>

      <div class="stat-row" style="margin-bottom:18px;">
        <div class="stat-box"><div class="n">${totalVotes}</div><div class="l">Total Votes Cast</div></div>
        <div class="stat-box"><div class="n">${sortedNominees.length}</div><div class="l">Nominees</div></div>
        <div class="stat-box"><div class="n">${e.seats||1}</div><div class="l">Seats Available</div></div>
      </div>

      ${winner && winner.votes > 0 ? `
        <div style="background:var(--gold-soft);border:1px solid #dcc47e;border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;gap:10px;">
          <div style="font-size:22px;">🏆</div>
          <div>
            <div style="font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.06em;color:var(--amber);">Current Leading Nominee</div>
            <div style="font-size:15px;font-weight:700;color:var(--navy);">${esc(winner.name)} — ${winner.votes} votes (${winner.percentage}%)</div>
          </div>
        </div>
      ` : ''}

      <div class="table-wrap" style="margin-bottom:18px;">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Nominee</th>
              <th>Card / Dept</th>
              <th style="text-align:right;">Votes</th>
              <th style="width:140px;">Share</th>
            </tr>
          </thead>
          <tbody>
            ${sortedNominees.map((n, idx) => `
              <tr>
                <td style="font-weight:700;color:var(--ink-muted);">#${idx+1}</td>
                <td><b>${esc(n.name)}</b><div style="font-size:12px;color:var(--ink-muted);">${esc(n.designation||'—')}</div></td>
                <td><div style="font-size:12px;">Card: ${esc(n.cardNo||'—')}</div><div style="font-size:12px;color:var(--ink-muted);">${esc(n.department||'—')}</div></td>
                <td style="text-align:right;font-weight:700;font-size:15px;">${n.votes}</td>
                <td>
                  <div style="font-size:12px;font-weight:600;margin-bottom:2px;">${n.percentage}%</div>
                  <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${n.percentage}%;"></div></div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>

      <div class="modal-actions" style="border-top:1px solid var(--line);padding-top:16px;">
        <button class="btn btn-outline" id="download-csv-btn">📥 Download Excel / CSV</button>
        <button class="btn btn-primary" id="download-pdf-btn">🖨️ Download PDF / Print</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('close-results-modal').addEventListener('click', () => overlay.remove());

  // Export CSV Action
  document.getElementById('download-csv-btn').addEventListener('click', () => {
    let csv = `\uFEFFRank,Nominee Name,Card No,Department,Designation,Votes,Percentage\n`;
    sortedNominees.forEach((n, idx) => {
      const row = [
        idx + 1,
        `"${(n.name||'').replace(/"/g, '""')}"`,
        `"${(n.cardNo||'').replace(/"/g, '""')}"`,
        `"${(n.department||'').replace(/"/g, '""')}"`,
        `"${(n.designation||'').replace(/"/g, '""')}"`,
        n.votes,
        `"${n.percentage}%"`

      csv += row.join(',') + '\n';
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `Election_Results_${(e.electionTitle||'Report').replace(/\s+/g, '_')}_${fmtDate(e.electionDate)}.csv`;

          td { padding: 10px 12px; border-bottom: 1px solid #E1E4EA; }

        <div class="report-header">

          <div class="item"><b>Election Date</b>${fmtDate(e.electionDate)}</div>
          <div class="item"><b>Total Votes Cast</b>${totalVotes}</div>
        </div>
        ${winner && winner.votes > 0 ? `
          <div class="winner-box">

            <span style="font-size:16px;font-weight:bold;">${esc(winner.name)} (${esc(winner.department||'—')})</span> — ${winner.votes} votes (${winner.percentage}%)

        <table>

          <tbody>
            ${sortedNominees.map((n, idx) => `
              <tr>
                <td>#${idx+1}</td>
                <td><b>${esc(n.name)}</b></td>
                <td>${esc(n.cardNo||'—')}</td>
                <td>${esc(n.department||'—')}</td>
                <td>${esc(n.designation||'—')}</td>
                <td style="text-align:right;font-weight:bold;">${n.votes}</td>
                <td style="text-align:right;">${n.percentage}%</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div style="font-size:11px;color:#5B6472;margin-top:20px;">Report Generated On: ${new Date().toLocaleString()}</div>

function bindResultEvents(units){
  document.querySelectorAll('[data-rnav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nav = btn.getAttribute('data-rnav');
      if(nav==='logout'){ addAudit(session.result.username,'LOGOUT','Central Desk portal'); session.result=null; location.hash='#/results'; render(); return; }
      resultState.view = nav;
      render();
    });
  });

  // Select all elections
  const selectAllElecs = document.getElementById('select-all-elections');
  if(selectAllElecs){
    selectAllElecs.addEventListener('change', (ev)=>{
      document.querySelectorAll('.election-checkbox').forEach(cb => cb.checked = ev.target.checked);
    });
  }

  // Deactivate Election
  document.querySelectorAll('[data-deactivate-elec]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-deactivate-elec');
      const e = await sget('election:'+id);
      if(!e) return;
      if(!confirm(`Deactivate ballot for "${e.electionTitle}"? Employees will not be able to vote.`)) return;
      
      e.status = 'deactivated';
      await sset('election:'+id, e);
      
      const idx = await sget('sys:elections_index', []);
      const item = idx.find(x=>x.id===id);
      if(item) { item.status = 'deactivated'; await sset('sys:elections_index', idx); }
      
      await addAudit(session.result.username, 'ELECTION_DEACTIVATED', e.electionTitle);
      toast('Ballot box deactivated.');
      render();
    });
  });

  // Reactivate Election
  document.querySelectorAll('[data-reactivate-elec]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-reactivate-elec');
      const e = await sget('election:'+id);
      if(!e) return;
      
      e.status = new Date(e.votingStart).getTime() > Date.now() ? 'scheduled' : 'active';
      await sset('election:'+id, e);
      
      const idx = await sget('sys:elections_index', []);
      const item = idx.find(x=>x.id===id);
      if(item) { item.status = e.status; await sset('sys:elections_index', idx); }
      
      await addAudit(session.result.username, 'ELECTION_REACTIVATED', e.electionTitle);
      toast('Ballot box reactivated.');
      render();
    });
  });

  // Delete Single Election
  document.querySelectorAll('[data-delete-elec]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-delete-elec');
      const idx = await sget('sys:elections_index', []);
      const target = idx.find(x=>x.id===id);
      if(!confirm(`Permanently delete ballot box "${target?target.electionTitle:'this election'}" and all its votes?`)) return;
      
      await sdel('election:'+id);
      await sdel('votes:'+id);
      
      const newIdx = idx.filter(x=>x.id!==id);
      await sset('sys:elections_index', newIdx);
      
      await addAudit(session.result.username, 'ELECTION_DELETED', target?target.electionTitle:id);
      toast('Ballot box permanently deleted.');
      render();
    });
  });

  // Bulk Delete Selected Elections
  const deleteSelectedElecsBtn = document.getElementById('delete-selected-elections-btn');
  if(deleteSelectedElecsBtn){
    deleteSelectedElecsBtn.addEventListener('click', async ()=>{
      const checked = Array.from(document.querySelectorAll('.election-checkbox:checked'));
      if(!checked.length){ toast('No ballot boxes selected.'); return; }
      if(!confirm(`Permanently delete ${checked.length} selected ballot box(es) and all their votes?`)) return;
      
      const idx = await sget('sys:elections_index', []);
      const idsToDelete = new Set(checked.map(cb => cb.getAttribute('data-elec-id')));
      
      for(const id of idsToDelete){
        await sdel('election:'+id);
        await sdel('votes:'+id);
      }
      
      const newIdx = idx.filter(x=>!idsToDelete.has(x.id));
      await sset('sys:elections_index', newIdx);
      
      await addAudit(session.result.username, 'ELECTIONS_BULK_DELETED', `${idsToDelete.size} ballot box(es)`);
      toast('Selected ballot boxes deleted.');
      render();
    });
  });

  // Notifications Toggle
  const adminNotifToggle = document.getElementById('admin-notif-toggle');
  if(adminNotifToggle){
    adminNotifToggle.addEventListener('change', async (ev)=>{
      const enabled = ev.target.checked;
      if(enabled && "Notification" in window){
        await Notification.requestPermission();
      }
      session.result.notifications = enabled;
      const admins = await sget('sys:result_admins', []);
      const idx = admins.findIndex(a=>a.username===session.result.username);
      if(idx>=0){ admins[idx].notifications = enabled; await sset('sys:result_admins', admins); }
      toast(`Notifications ${enabled?'enabled':'disabled'}.`);
    });
  }

  // Audit Log Selection and Bulk Deletion
  const selectAllLogs = document.getElementById('select-all-logs');
  if(selectAllLogs){
    selectAllLogs.addEventListener('change', (ev)=>{
      document.querySelectorAll('.audit-checkbox').forEach(cb => cb.checked = ev.target.checked);
    });
  }

  const deleteSelectedBtn = document.getElementById('delete-selected-logs-btn');
  if(deleteSelectedBtn){
    deleteSelectedBtn.addEventListener('click', async ()=>{
      const checked = Array.from(document.querySelectorAll('.audit-checkbox:checked'));
      if(!checked.length){ toast('No logs selected.'); return; }
      if(!confirm(`Delete ${checked.length} selected audit log(s)?`)) return;
      
      const log = await sget('sys:audit_log', []);
      const idsToDelete = new Set(checked.map(cb => cb.getAttribute('data-log-id')));
      const newLog = log.filter((l, idx) => !idsToDelete.has(l.id||String(idx)));
      
      await sset('sys:audit_log', newLog);
      toast('Selected logs deleted.');
      render();
    });
  }

  const clearAllLogsBtn = document.getElementById('clear-all-logs-btn');
  if(clearAllLogsBtn){
    clearAllLogsBtn.addEventListener('click', async ()=>{
      if(!confirm('Are you sure you want to clear the entire audit log history?')) return;
      await sset('sys:audit_log', []);
      toast('All audit logs cleared.');
      render();
    });
  }

  // View & Download Results Modal Trigger
  document.querySelectorAll('[data-view-results]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const electionId = btn.getAttribute('data-view-results');
      showResultsModal(electionId, units);
    });
  });

  const addUnitForm = document.getElementById('add-unit-form');
  if(addUnitForm){
    addUnitForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const name = new FormData(ev.target).get('unitName').trim();
      if(!name) return;
      const list = await sget('sys:units', []);
      list.push({id: uid('u'), name});
      await sset('sys:units', list);
      await addAudit(session.result.username, 'UNIT_ADDED', name);
      toast('Unit added.');
      render();
    });
  }

  document.querySelectorAll('[data-remove-unit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const unitId = btn.getAttribute('data-remove-unit');
      const list = await sget('sys:units', []);
      const unit = list.find(u=>u.id===unitId);
      if(!unit) return;
      if(!confirm(`Are you sure you want to remove unit "${unit.name}"?`)) return;
      const newList = list.filter(u=>u.id!==unitId);
      await sset('sys:units', newList);
      await addAudit(session.result.username, 'UNIT_REMOVED', unit.name);
      toast(`Unit "${unit.name}" removed successfully.`);
      render();
    });
  });

  const addHrForm = document.getElementById('add-hr-form');
  if(addHrForm){
    addHrForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const username = fd.get('username').trim();
      const unitIds = fd.getAll('unit');
      const list = await sget('sys:hr_users', []);
      if(list.some(u=>u.username===username)){ toast('Username already exists.'); return; }
      list.push({username, name:fd.get('name').trim(), password:fd.get('password'), unitIds, notifications:true});
      await sset('sys:hr_users', list);
      await addAudit(session.result.username, 'HR_USER_ADDED', username);
      toast('HR user added.');
      render();
    });
  }

  document.querySelectorAll('[data-edit-hr]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      showEditHrModal(btn.getAttribute('data-edit-hr'), units);
    });
  });

  document.querySelectorAll('[data-remove-hr]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const username = btn.getAttribute('data-remove-hr');
      if(!confirm(`Are you sure you want to remove HR user "${username}"?`)) return;
      let list = await sget('sys:hr_users', []);
      list = list.filter(u=>u.username!==username);
      await sset('sys:hr_users', list);
      await addAudit(session.result.username, 'HR_USER_REMOVED', username);
      toast('HR user removed.');
      render();
    });
  });

  const adminAccountForm = document.getElementById('admin-account-form');
  if(adminAccountForm){
    adminAccountForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const username = fd.get('username').trim();
      const name = fd.get('name').trim();
      const email = fd.get('email').trim();
      const phone = fd.get('phone').trim();
      const newPassword = fd.get('password');

      const errBox = document.getElementById('admin-account-error');
      const okBox = document.getElementById('admin-account-success');
      errBox.innerHTML = ''; okBox.innerHTML = '';

      const admins = await sget('sys:result_admins', []);
      const idx = admins.findIndex(a=>a.username===session.result.username);
      if(idx===-1) return;

      admins[idx].username = username;
      admins[idx].name = name;
      admins[idx].email = email;
      admins[idx].phone = phone;
      if(newPassword && newPassword.trim().length > 0){
        admins[idx].password = newPassword.trim();
      }

      await sset('sys:result_admins', admins);
      session.result = admins[idx];
      await addAudit(username, 'ACCOUNT_UPDATED', 'Credentials & verification info updated');
      okBox.innerHTML = `<div class="hint-box" style="color:var(--success);background:var(--success-soft);"><b>Success.</b> Account details updated.</div>`;
      toast('Account updated.');
    });
  }
}

function showEditHrModal(username, units){
  (async ()=>{
    const hrUsers = await sget('sys:hr_users', []);
    const user = hrUsers.find(u=>u.username===username);
    if(!user) return;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal">
        <h3>Edit HR User</h3>
        <div id="edit-hr-error"></div>
        <form id="edit-hr-form">
          <div class="field"><label>Username</label><input name="username" value="${esc(user.username)}" required></div>
          <div class="field"><label>Full Name</label><input name="name" value="${esc(user.name)}" required></div>
          <div class="field"><label>Password</label><input name="password" value="${esc(user.password)}" required></div>
          <div class="field"><label>Assign Unit(s)</label>
            <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;">
              ${units.map(u=>`<label style="display:flex;align-items:center;gap:6px;font-size:13.5px;"><input type="checkbox" name="unit" value="${u.id}" ${(user.unitIds||[]).includes(u.id)?'checked':''}> ${esc(u.name)}</label>`).join('')}
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn btn-outline" type="button" id="cancel-edit-hr">Cancel</button>
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('cancel-edit-hr').addEventListener('click', ()=>overlay.remove());
    document.getElementById('edit-hr-form').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const newUsername = fd.get('username').trim();
      const errBox = document.getElementById('edit-hr-error');
      const list = await sget('sys:hr_users', []);
      if(newUsername !== username && list.some(u=>u.username===newUsername)){
        errBox.innerHTML = `<div class="error-box">That username is already taken.</div>`;
        return;
      }
      const u = list.find(x=>x.username===username);
      if(!u) return;
      u.username = newUsername;
      u.name = fd.get('name').trim();
      u.password = fd.get('password');
      u.unitIds = fd.getAll('unit');
      await sset('sys:hr_users', list);
      await addAudit(session.result.username, 'HR_USER_UPDATED', newUsername);
      overlay.remove();
      toast('HR user updated.');
      render();
    });
  })();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
