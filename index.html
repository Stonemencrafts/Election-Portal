<title>Committee Election Management System</title>

<style>

    --navy-soft:#EEF1F7;
    --gold:#B08D2B;
    --gold-soft:#F3E9CC;
    --ink:#1B1F27;
    --ink-muted:#5B6472;
    --line:#E1E4EA;
    --bg:#F5F6F9;
    --surface:#FFFFFF;
    --success:#1F7A4D;
    --success-soft:#E4F3EA;
    --danger:#B3261E;
    --danger-soft:#FBE8E6;
    --amber:#8A5A00;
    --amber-soft:#FBF0DD;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  .mono{font-family:'JetBrains Mono',monospace;}
  ::selection{background:var(--gold-soft);}

  #app{min-height:100vh;}
  .center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
    radial-gradient(1200px 500px at 10% -10%, #1a2c53 0%, transparent 60%),
    var(--navy);}
  .auth-card{
    width:100%;max-width:420px;background:var(--surface);border-radius:16px;

  .btn-primary:hover{background:var(--navy-2);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-gold:hover{background:#9a7a25;}
  .btn-outline{background:#fff;border-color:var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--navy-2);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#8f1e18;}
  .btn-full{width:100%;}

  .error-box{background:var(--danger-soft);color:var(--danger);border:1px solid #f2c9c5;padding:10px 12px;border-radius:8px;font-size:13.5px;margin-bottom:14px;}

  .cloud-bar-top{background:var(--navy-soft);border-bottom:1px solid var(--line);padding:8px 18px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--navy-2);font-weight:600;}

  .landing{max-width:980px;margin:0 auto;padding:56px 24px 80px;}
  .landing-hero{text-align:center;margin-bottom:44px;}
  .landing-hero .seal{margin:0 auto 18px;width:64px;height:64px;font-size:24px;}
  .landing-hero h1{font-size:34px;margin:0 0 8px;color:var(--navy);}
  .landing-hero p{color:var(--ink-muted);font-size:15.5px;max-width:520px;margin:0 auto;}

  .portal-card .icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:18px;}

  .sticky-submit{position:sticky;bottom:0;background:linear-gradient(to top, var(--bg) 70%, transparent);padding:18px 0 6px;}
  .submit-bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 -6px 24px -14px rgba(0,0,0,.2), var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}

  .status-screen h2{font-size:20px;margin:0 0 8px;}
  .status-screen p{color:var(--ink-muted);font-size:14.5px;line-height:1.6;}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:16px;max-width:480px;width:100%;padding:28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);}
  .modal h3{font-size:18px;margin:0 0 10px;}
  .modal p{font-size:14.5px;color:var(--ink-muted);line-height:1.6;margin:0 0 20px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:200;}

  .empty-state{text-align:center;padding:44px 20px;color:var(--ink-muted);}
  .empty-state .em-icon{font-size:30px;margin-bottom:10px;}

  .audit-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .audit-item:last-child{border-bottom:none;}
  .audit-item .ts{color:var(--ink-muted);width:150px;flex-shrink:0;font-size:12px;}
  .link-copy-box{display:flex;gap:8px;align-items:center;background:#fbfbfc;border:1.5px dashed var(--line);padding:10px 12px;border-radius:9px;}
  .link-copy-box input{border:none;background:transparent;flex:1;font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--navy-2);}
</style>

<script>
/* =========================================================================
  /* =========================================================================
   REAL-TIME CLOUD DATABASE CONFIGURATION
   ========================================================================= */
const FIREBASE_DATABASE_URL = "https://committee-election-management-default-rtdb.firebaseio.com";

const memStore = {};

async function fetchCloudData(){
  try {
    const res = await fetch(`${FIREBASE_DATABASE_URL}/.json`);
    return await res.json();
  } catch(e) {
    console.error("Cloud fetch error:", e);
    return null;
  }
}

async function sget(key, fallback=null){
  if(memStore[key] !== undefined) return memStore[key];
  try {
    const raw = localStorage.getItem('cems:' + key);
    if(raw !== null) {
      memStore[key] = JSON.parse(raw);
      return memStore[key];
    }
  } catch(e){}
  return fallback;
}

async function sset(key, value){
  memStore[key] = value;
  try { localStorage.setItem('cems:' + key, JSON.stringify(value)); } catch(e){}
  
  try {
    const sanitizedKey = key.replace(/:/g, '_');
    await fetch(`${FIREBASE_DATABASE_URL}/${sanitizedKey}.json`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(value)
    });
  } catch(e) {
    console.error("Cloud write error:", e);
  }
  return true;
}

async function syncAllFromCloud(){
  const cloud = await fetchCloudData();
  if(!cloud) return;
  for(const k in cloud){
    const originalKey = k.replace(/_/g, ':');
    memStore[originalKey] = cloud[k];
    try { localStorage.setItem('cems:' + originalKey, JSON.stringify(cloud[k])); } catch(e){}
  }
}

    memStore[originalKey] = cloud[k];
    try { localStorage.setItem('cems:' + originalKey, JSON.stringify(cloud[k])); } catch(e){}
  }
}

function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function makeSlug(){ return Math.random().toString(36).slice(2,10); }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(d){ if(!d) return '—'; return new Date(d).toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

async function addAudit(actor, action, detail){
  const log = await sget('sys:audit_log', []);
  log.unshift({ts:new Date().toISOString(), actor, action, detail: detail||''});
  await sset('sys:audit_log', log.slice(0,500));
}

let session = { hr:null, result:null };

function computedStatus(e){
  if(e.status==='draft'||e.status==='deactivated'||e.status==='archived') return e.status;
  const now = Date.now();
  const start = new Date(e.votingStart).getTime();
  const end = new Date(e.votingEnd).getTime();
  if(isNaN(start) || isNaN(end)) return e.status || 'draft';
  if(now < start) return 'scheduled';
  if(now >= start && now <= end) return 'active';
  return 'closed';
}
const STATUS_LABEL = {draft:'Draft', scheduled:'Scheduled', active:'Active', closed:'Closed', deactivated:'Deactivated', archived:'Archived'};
function statusBadge(status){
  return `<span class="badge badge-${status}">${STATUS_LABEL[status]||status}</span>`;
}

window.addEventListener('hashchange', render);

function currentRoute(){ return location.hash.replace(/^#/,'') || '/'; }

async function render(){
  const route = currentRoute();
  const app = document.getElementById('app');
  window.scrollTo(0,0);
  if(route.startsWith('/vote/')){ await renderVoting(app, decodeURIComponent(route.slice(6))); return; }
  if(route === '/admin'){ await renderAdmin(app); return; }
  if(route === '/results'){ await renderResults(app); return; }
  await renderLanding(app);
}

// ---------------------------------------------------------------- LANDING
async function renderLanding(app){
  const idx = await sget('sys:elections_index', []);

  app.innerHTML = `

let adminState = { view:'dashboard', electionId:null, tab:'details', draft:null, error:null, filter:'all' };

async function renderAdmin(app){
  if(!session.hr){ renderAdminLogin(app); return; }
  await renderAdminShell(app);
}

function renderAdminLogin(app){
  app.innerHTML = `
    <div class="center-wrap">
      <div class="auth-card">
        <div class="brand-row">
          <div class="seal">CE</div>
          <div>
            <div class="t1">User Portal</div>
            <div class="t2">HR / Unit Manager</div>
          </div>
        </div>
        <div id="admin-login-error"></div>
        <form id="admin-login-form">
          <div class="field"><label>Username</label><input name="username" autocomplete="username" required></div>
          <div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div>
          <button class="btn btn-primary btn-full" type="submit">Log In</button>
        </form>
        <div style="text-align:center;margin-top:16px;"><a href="#/" style="font-size:13px;color:var(--ink-muted);">← Back to portal selection</a></div>
      </div>
    </div>
  `;
  document.getElementById('admin-login-form').addEventListener('submit', async (ev)=>{
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const username = fd.get('username').trim();
    const password = fd.get('password');
    const users = await sget('sys:hr_users', []);
    const u = users.find(x=>x.username===username && x.password===password);
    const errBox = document.getElementById('admin-login-error');
    if(!u){
      await addAudit(username||'(unknown)', 'LOGIN_FAILED', 'User portal');
      errBox.innerHTML = `<div class="error-box">Invalid username or password.</div>`;
      return;

    session.hr = u;
    adminState = { view:'dashboard', electionId:null, tab:'details', draft:null, error:null, filter:'all' };
    await addAudit(u.username, 'LOGIN_SUCCESS', 'User portal');
    location.hash = '#/admin';
    render();
  });
}

async function renderAdminShell(app){
  const units = await sget('sys:units', []);
  const myUnits = units.filter(u => session.hr.unitIds && session.hr.unitIds.includes(u.id));
  const idx = await sget('sys:elections_index', []);
  const myElections = idx.filter(e => session.hr.unitIds && session.hr.unitIds.includes(e.unitId));

  let body = '';
  if(adminState.view === 'dashboard') body = adminDashboardHTML(myElections, units);
  else if(adminState.view === 'elections') body = adminElectionsListHTML(myElections, units, adminState.filter||'all');
  else if(adminState.view === 'editor') body = await adminEditorHTML(units);
  else if(adminState.view === 'profile') body = adminProfileHTML();

  app.innerHTML = `
    <div class="shell">
      <div class="sidebar">
        <div class="brand-row"><div class="seal" style="width:36px;height:36px;font-size:14px;">CE</div><div><div class="t1">User Portal</div><div class="t2" style="font-size:15px;">HR Unit</div></div></div>
        <div class="side-user"><b>${esc(session.hr.name)}</b>${myUnits.map(u=>u.name).join(', ') || 'No Assigned Units'}</div>
        <div class="navgroup">
          <button class="navlink ${adminState.view==='dashboard'?'active':''}" data-nav="dashboard"><span class="dot"></span>Dashboard</button>
          <button class="navlink ${adminState.view==='elections'&&adminState.filter==='active'?'active':''}" data-nav="elections" data-filter="active"><span class="dot"></span>Active Elections</button>
          <button class="navlink ${adminState.view==='elections'&&adminState.filter==='scheduled'?'active':''}" data-nav="elections" data-filter="scheduled"><span class="dot"></span>Scheduled Elections</button>
          <button class="navlink ${adminState.view==='elections'&&adminState.filter==='draft'?'active':''}" data-nav="elections" data-filter="draft"><span class="dot"></span>Draft Elections</button>
          <button class="navlink ${adminState.view==='elections'&&adminState.filter==='all'?'active':''}" data-nav="elections" data-filter="all"><span class="dot"></span>Election History</button>
        </div>
        <div class="navgroup">
          <div class="navgroup-label">Manage</div>
          <button class="navlink" data-nav="new"><span class="dot"></span>+ Create New Election</button>
          <button class="navlink ${adminState.view==='profile'?'active':''}" data-nav="profile"><span class="dot"></span>Account Details</button>
        </div>
        <div class="sidebar-footer">
          <button class="navlink" data-nav="logout"><span class="dot"></span>Log Out</button>
        </div>
      </div>
      <div class="main">${body}</div>
    </div>
  `;
  bindAdminShellEvents(units);
}

function adminDashboardHTML(myElections, units){
  const unitName = id => (units.find(u=>u.id===id)||{}).name || id;
  const counts = {active:0,scheduled:0,draft:0,closed:0};
  myElections.forEach(e=>{ const s=computedStatus(e); if(counts[s]!==undefined) counts[s]++; });
  return `
    <div class="page-head">
      <div><h1>Dashboard</h1><p>Overview of elections across your assigned unit(s).</p></div>
      <button class="btn btn-primary" data-nav="new">+ Create New Election</button>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="n">${counts.active}</div><div class="l">Active</div></div>
      <div class="stat-box"><div class="n">${counts.scheduled}</div><div class="l">Scheduled</div></div>
      <div class="stat-box"><div class="n">${counts.draft}</div><div class="l">Draft</div></div>
      <div class="stat-box"><div class="n">${myElections.length}</div><div class="l">Total</div></div>
    </div>
    <div class="card">
      <h2>Recent elections</h2>
      ${adminElectionsTable(myElections.slice(0,6), units)}

  `;
}

function adminElectionsListHTML(myElections, units, filter){

  return `

function bindAdminShellEvents(units){
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const nav = btn.getAttribute('data-nav');
      if(nav==='logout'){ addAudit(session.hr.username,'LOGOUT','User portal'); session.hr=null; location.hash='#/admin'; render(); return; }
      if(nav==='dashboard'){ adminState = {view:'dashboard',electionId:null,tab:'details',draft:null,error:null,filter:'all'}; render(); return; }
      if(nav==='elections'){ adminState = {view:'elections',filter:btn.getAttribute('data-filter')||'all',electionId:null,tab:'details',draft:null,error:null}; render(); return; }
      if(nav==='profile'){ adminState = {view:'profile',electionId:null,tab:'details',draft:null,error:null,filter:'all'}; render(); return; }
      if(nav==='new'){
        const myUnits = units.filter(u=>session.hr.unitIds && session.hr.unitIds.includes(u.id));
        adminState = { view:'editor', tab:'details', error:null, filter:'all', draft:{
          id:null, unitId:(myUnits[0]||{}).id, committeeName:'', electionTitle:'', instructions:'',
          electionDate:'', votingStart:'', votingEnd:'', votingType:'single', seats:1, eligibleVoters:'',
          nominees:[], status:'draft', slug:null, createdBy:session.hr.username
        }};
        render(); return;
      }
    });
  });
  document.querySelectorAll('[data-open-election]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.getAttribute('data-open-election');
      const full = await sget('election:'+id);
      adminState = { view:'editor', tab:'details', error:null, draft: full, filter:'all' };
      render();
    });
  });
  if(adminState.view==='editor') bindEditorEvents(units);
  if(adminState.view==='profile') bindAdminProfileEvents();
}

function bindAdminProfileEvents(){
  const pwForm = document.getElementById('hr-pw-form');
  if(pwForm){
    pwForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const currentPassword = fd.get('currentPassword');
      const newPassword = fd.get('newPassword');
      const confirmPassword = fd.get('confirmPassword');
      const errBox = document.getElementById('hr-pw-error');
      const okBox = document.getElementById('hr-pw-success');
      errBox.innerHTML = ''; okBox.innerHTML = '';
      if(currentPassword !== session.hr.password){
        errBox.innerHTML = `<div class="error-box">Current password is incorrect.</div>`;
        return;
      }
      if(newPassword !== confirmPassword){
        errBox.innerHTML = `<div class="error-box">Passwords do not match.</div>`;
        return;
      }
      const list = await sget('sys:hr_users', []);
      const idx = list.findIndex(u=>u.username===session.hr.username);
      if(idx===-1) return;
      list[idx].password = newPassword;
      await sset('sys:hr_users', list);
      session.hr = list[idx];
      await addAudit(session.hr.username, 'PASSWORD_CHANGED', 'User portal');
      okBox.innerHTML = `<div class="hint-box" style="color:var(--success);background:var(--success-soft);"><b>Success.</b> Password updated successfully.</div>`;
      ev.target.reset();
    });
  }
}

function bindEditorEvents(){
  document.querySelectorAll('[data-etab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ adminState.tab = btn.getAttribute('data-etab'); render(); });
  });

  const detailsForm = document.getElementById('details-form');
  if(detailsForm){
    detailsForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const e = adminState.draft;
      e.unitId = fd.get('unitId');
      e.committeeName = fd.get('committeeName').trim();
      e.electionTitle = fd.get('electionTitle').trim();
      e.instructions = fd.get('instructions').trim();
      e.electionDate = fd.get('electionDate');
      e.votingStart = fd.get('votingStart');
      e.votingEnd = fd.get('votingEnd');
      e.votingType = fd.get('votingType');
      e.seats = parseInt(fd.get('seats')||'1',10) || 1;
      e.eligibleVoters = fd.get('eligibleVoters') ? parseInt(fd.get('eligibleVoters'),10) : '';
      const savedId = await persistElection(e, 'ELECTION_SAVED');
      adminState.draft.id = savedId;
      adminState.tab = 'nominees';
      toast('Election details saved.');
      render();
    });
  }

  const addNomBtn = document.getElementById('add-nominee-btn');
  if(addNomBtn){
    addNomBtn.addEventListener('click', ()=>{
      const e = adminState.draft;
      e.nominees = e.nominees || [];
      e.nominees.push({id:uid('nom'), name:'', cardNo:'', department:'', designation:'', photo:'', order:e.nominees.length});
      render();
    });
  }
  document.querySelectorAll('[data-remove-nom]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-remove-nom'),10);
      adminState.draft.nominees.splice(i,1);
      adminState.draft.nominees.forEach((n,idx)=>n.order=idx);
      render();
    });
  });
  document.querySelectorAll('[data-move-up]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-move-up'),10);
      const arr = adminState.draft.nominees;
      [arr[i-1],arr[i]] = [arr[i],arr[i-1]];
      arr.forEach((n,idx)=>n.order=idx);
      render();
    });
  });
  document.querySelectorAll('[data-move-down]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const i = parseInt(btn.getAttribute('data-move-down'),10);
      const arr = adminState.draft.nominees;
      [arr[i+1],arr[i]] = [arr[i],arr[i+1]];
      arr.forEach((n,idx)=>n.order=idx);
      render();
    });
  });
  document.querySelectorAll('.nom-editor-row').forEach(row=>{
    const idx = parseInt(row.getAttribute('data-nom-idx'),10);
    row.querySelectorAll('.nom-field').forEach(inp=>{
      inp.addEventListener('input', ()=>{ adminState.draft.nominees[idx][inp.getAttribute('data-f')] = inp.value; });
    });
    const photoInput = row.querySelector('.nom-photo-input');
    if(photoInput){
      photoInput.addEventListener('change', (ev)=>{
        const file = ev.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ()=>{ adminState.draft.nominees[idx].photo = reader.result; render(); };
        reader.readAsDataURL(file);
      });
    }
  });
  const saveNomBtn = document.getElementById('save-nominees-btn');
  if(saveNomBtn){
    saveNomBtn.addEventListener('click', async ()=>{
      const e = adminState.draft;
      if(!e.id){ toast('Save details first.'); adminState.tab='details'; render(); return; }
      await persistElection(e, 'NOMINEES_UPDATED');
      toast('Nominees saved.');
      render();
    });
  }
  const saveDraftBtn = document.getElementById('save-draft-btn');
  if(saveDraftBtn){
    saveDraftBtn.addEventListener('click', async ()=>{
      adminState.draft.status = 'draft';
      await persistElection(adminState.draft, 'ELECTION_SAVED_DRAFT');
      toast('Saved as draft.');
      render();
    });
  }
  const activateBtn = document.getElementById('activate-btn');
  if(activateBtn){
    activateBtn.addEventListener('click', async ()=>{
      const e = adminState.draft;
      if(!e.electionTitle || !e.votingStart || !e.votingEnd){ adminState.error='Complete Election Info first.'; render(); return; }
      if(!e.nominees || e.nominees.length < 2){ adminState.error='Add at least 2 nominees.'; render(); return; }
      if(!e.slug) e.slug = makeSlug();
      e.status = new Date(e.votingStart).getTime() > Date.now() ? 'scheduled' : 'active';
      await persistElection(e, 'ELECTION_ACTIVATED');
      toast('Election activated.');
      adminState.tab = 'link';
      render();
    });
  }
  const copyBtn = document.getElementById('copy-link-btn');
  if(copyBtn){
    copyBtn.addEventListener('click', ()=>{
      const inp = document.getElementById('voting-link-input');
      inp.select();
      document.execCommand('copy');
      toast('Link copied.');
    });
  }
}

async function persistElection(e, auditAction){
  if(!e.id) e.id = uid('elec');
  await sset('election:'+e.id, e);
  const idx = await sget('sys:elections_index', []);
  const i = idx.findIndex(x=>x.id===e.id);
  const summary = {
    id:e.id, slug:e.slug||null, unitId:e.unitId, committeeName:e.committeeName, electionTitle:e.electionTitle,
    electionDate:e.electionDate, votingStart:e.votingStart, votingEnd:e.votingEnd, status:e.status,
    nomineeCount:(e.nominees||[]).length, createdBy:e.createdBy
  };
  if(i>=0) idx[i]=summary; else idx.push(summary);
  await sset('sys:elections_index', idx);
  await addAudit(session.hr?session.hr.username:'admin', auditAction, e.electionTitle);
  return e.id;
}

// ---------------------------------------------------------------- VOTING PORTAL (KIOSK)
let voteState = { selected:[], done:false, receiptId:null };

async function renderVoting(app, slugParam){
  const idx = await sget('sys:elections_index', []);
  const summary = idx.find(x=>x.slug===slugParam);
  if(!summary){
    app.innerHTML = statusScreen('🔎','Election Not Found','This voting link is invalid.');
    return;
  }
  const e = await sget('election:'+summary.id);
  const status = computedStatus(e);
  if(status!=='active'){
    app.innerHTML = statusScreen('⏸️','Voting Unavailable',`This election is currently ${status}.`);
    return;
  }
  if(voteState.done){
    app.innerHTML = statusScreen('✅','Vote Submitted','Thank you for participating.',`Receipt: ${voteState.receiptId}`, true);
    document.getElementById('next-voter-btn').addEventListener('click', ()=>{
      voteState = { selected:[], done:false, receiptId:null };
      render();
    });
    return;
  }
  app.innerHTML = `<div class="vote-wrap">${ballotMarkup(e,{preview:false})}</div>`;
  bindVotingEvents(e);
}

function statusScreen(icon,title,body,footnote,showNext){
  return `
    <div class="status-screen">
      <div class="icon-circle" style="background:var(--navy-soft);">${icon}</div>
      <h2>${esc(title)}</h2>
      <p>${esc(body)}</p>
      ${footnote?`<p class="mono" style="font-size:12px;margin-top:10px;color:var(--ink-muted);">${esc(footnote)}</p>`:''}
      ${showNext?`<div style="margin-top:20px;"><button class="btn btn-gold" id="next-voter-btn">Next Voter →</button></div>`:''}
    </div>
  `;
}

function bindVotingEvents(e){
  document.querySelectorAll('.nominee-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const id = card.getAttribute('data-nom-id');
      voteState.selected = voteState.selected[0]===id ? [] : [id];
      document.querySelectorAll('.nominee-card').forEach(c=>c.classList.toggle('selected', c.getAttribute('data-nom-id')===voteState.selected[0]));
      const n = (e.nominees||[]).find(x=>x.id===voteState.selected[0]);
      document.getElementById('sel-name-display').textContent = n ? n.name : 'None selected';
      document.getElementById('submit-vote-btn').disabled = !n;
    });
  });
  const submitBtn = document.getElementById('submit-vote-btn');
  if(submitBtn){
    submitBtn.addEventListener('click', async ()=>{
      const votes = await sget('votes:'+e.id, []);
      const voteId = uid('vote');
      votes.push({ voteId, ts:new Date().toISOString(), nomineeIds: voteState.selected.slice() });
      await sset('votes:'+e.id, votes);
      voteState = { selected:[], done:true, receiptId:voteId };
      render();
    });
  }
}

function bindResultEvents(units){
  document.querySelectorAll('[data-rnav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nav = btn.getAttribute('data-rnav');
      if(nav==='logout'){ addAudit(session.result.username,'LOGOUT','Admin portal'); session.result=null; location.hash='#/results'; render(); return; }
      resultState.view = nav;
      render();
    });
  });

  const addUnitForm = document.getElementById('add-unit-form');
  if(addUnitForm){
    addUnitForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const name = new FormData(ev.target).get('unitName').trim();
      if(!name) return;
      const list = await sget('sys:units', []);
      list.push({id: uid('u'), name});
      await sset('sys:units', list);
      await addAudit(session.result.username, 'UNIT_ADDED', name);
      toast('Unit added.');
      render();
    });
  }

  // Delete Unit (Unrestricted deletion of any unit, including Unit 4)
  document.querySelectorAll('[data-remove-unit]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const unitId = btn.getAttribute('data-remove-unit');
      const list = await sget('sys:units', []);
      const unit = list.find(u=>u.id===unitId);
      if(!unit) return;
      if(!confirm(`Are you sure you want to remove unit "${unit.name}"?`)) return;
      const newList = list.filter(u=>u.id!==unitId);
      await sset('sys:units', newList);
      await addAudit(session.result.username, 'UNIT_REMOVED', unit.name);
      toast(`Unit "${unit.name}" removed successfully.`);
      render();
    });
  });

  // Add HR User
  const addHrForm = document.getElementById('add-hr-form');
  if(addHrForm){
    addHrForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const username = fd.get('username').trim();
      const unitIds = fd.getAll('unit');
      const list = await sget('sys:hr_users', []);
      if(list.some(u=>u.username===username)){ toast('Username already exists.'); return; }
      list.push({username, name:fd.get('name').trim(), password:fd.get('password'), unitIds});
      await sset('sys:hr_users', list);
      await addAudit(session.result.username, 'HR_USER_ADDED', username);
      toast('HR user added.');
      render();
    });
  }

  // Edit HR User Modal Trigger
  document.querySelectorAll('[data-edit-hr]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      showEditHrModal(btn.getAttribute('data-edit-hr'), units);
    });
  });

  // Remove HR User
  document.querySelectorAll('[data-remove-hr]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const username = btn.getAttribute('data-remove-hr');
      if(!confirm(`Are you sure you want to remove HR user "${username}"?`)) return;
      let list = await sget('sys:hr_users', []);
      list = list.filter(u=>u.username!==username);
      await sset('sys:hr_users', list);
      await addAudit(session.result.username, 'HR_USER_REMOVED', username);
      toast('HR user removed.');
      render();
    });
  });

  // Save Account Details for Super Admin
  const adminAccountForm = document.getElementById('admin-account-form');
  if(adminAccountForm){
    adminAccountForm.addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const username = fd.get('username').trim();
      const name = fd.get('name').trim();
      const email = fd.get('email').trim();
      const phone = fd.get('phone').trim();
      const newPassword = fd.get('password');

      const errBox = document.getElementById('admin-account-error');
      const okBox = document.getElementById('admin-account-success');
      errBox.innerHTML = ''; okBox.innerHTML = '';

      const admins = await sget('sys:result_admins', []);
      const idx = admins.findIndex(a=>a.username===session.result.username);
      if(idx===-1) return;

      admins[idx].username = username;
      admins[idx].name = name;
      admins[idx].email = email;
      admins[idx].phone = phone;
      if(newPassword && newPassword.trim().length > 0){
        admins[idx].password = newPassword.trim();
      }

      await sset('sys:result_admins', admins);
      session.result = admins[idx];
      await addAudit(username, 'ADMIN_ACCOUNT_UPDATED', 'Credentials & verification info updated');
      okBox.innerHTML = `<div class="hint-box" style="color:var(--success);background:var(--success-soft);"><b>Success.</b> Admin account details updated.</div>`;
      toast('Admin account updated.');
    });
  }
}

    document.body.appendChild(overlay);
    document.getElementById('cancel-edit-hr').addEventListener('click', ()=>overlay.remove());
    document.getElementById('edit-hr-form').addEventListener('submit', async (ev)=>{
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const newUsername = fd.get('username').trim();
      const errBox = document.getElementById('edit-hr-error');
      const list = await sget('sys:hr_users', []);
      if(newUsername !== username && list.some(u=>u.username===newUsername)){
        errBox.innerHTML = `<div class="error-box">That username is already taken.</div>`;
        return;
      }
      const u = list.find(x=>x.username===username);
      if(!u) return;
      u.username = newUsername;
      u.name = fd.get('name').trim();
      u.password = fd.get('password');
      u.unitIds = fd.getAll('unit');
      await sset('sys:hr_users', list);
      await addAudit(session.result.username, 'HR_USER_UPDATED', newUsername);
      overlay.remove();
      toast('HR user updated.');
      render();
    });
  })();
}

boot();
</script>
</body>
</html>
